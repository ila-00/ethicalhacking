<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Box</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f4f9;
    }
    form {
      display: flex;
      background: white;
      border-radius: 25px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 5px;
    }
    input[type="text"] {
      border: none;
      outline: none;
      padding: 10px 15px;
      border-radius: 25px 0 0 25px;
      font-size: 16px;
      width: 250px;
    }
    button {
      border: none;
      background: #007bff;
      color: white;
      padding: 10px 20px;
      border-radius: 0 25px 25px 0;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <!-- Replace your@email.com with your actual email -->
  <form action="https://formsubmit.co/your@email.com" method="POST">
    <input type="text" name="search" placeholder="Enter your search query..." required>
    <button type="submit">Search</button>
  </form>
</body>
</html>
